name: Build leetcode.ashish.me

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        # We need full history to introspect created/updated:
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - uses: actions/cache@v4
        name: Configure pip caching
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          alias pip3.9='python -m pip'
          pip install -r requirements.txt
      - name: Build database
        run: python build_database.py
      - name: Update README
        run: |-
          python build_readme.py --rewrite
          cat README.md
      - name: Commit and push if README changed
        run: |-
          git diff
          git config --global user.email "ashishsushilpatel@gmail.com"
          git config --global user.name "Ashish Patel"
          git diff --quiet || (git add . && git commit -m "chore: update README")
          git push
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT }}
      - name: Deploy Datasette using Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |-
          alias pip3.9='python -m pip'
          datasette publish dokploy problems.db \
            --image ghcr.io/${{ github.repository }}:latest \
            --install "datasette==0.65.2" \
            --dokploy-url "$DOKPLOY_URL" \
            --application-id "$DOKPLOY_APPLICATION_ID" \
            --api-key "$DOKPLOY_API_KEY" \
            --metadata .github/metadata.yaml \
            --static static:static \
            --install "datasette-template-sql==1.0.2" \
            --install "datasette-atom==0.9" \
            --install "datasette-json-html==1.0.1" \
            --install beautifulsoup4 \
            --install "datasette-debug-asgi==1.1" \
            --install "datasette-graphql==2.2" \
            --install "datasette-media==0.5.1" \
            --plugins-dir .github/plugins \
            --template-dir .github/templates
